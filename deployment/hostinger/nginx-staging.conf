map $uri $portal_staging_safe_uri {
    ~^/api/invite/ /api/invite/[REDACTED];
    default $uri;
}
log_format portal_staging_safe '$remote_addr - $remote_user [$time_local] "$request_method $portal_staging_safe_uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name staging-portal.example.com;
    access_log /var/log/signature-portal/staging-access.log portal_staging_safe;
    # Deliberately drop query strings on plaintext requests so credentials are never forwarded from HTTP.
    return 301 https://staging-portal.example.com$uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-portal.example.com;
    access_log /var/log/signature-portal/staging-access.log portal_staging_safe;

    ssl_certificate /etc/letsencrypt/live/staging-portal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-portal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PortalStagingTLS:10m;
    ssl_session_tickets off;
    server_tokens off;

    auth_basic "Private staging";
    auth_basic_user_file /etc/nginx/.htpasswd-signature-portal-staging;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
