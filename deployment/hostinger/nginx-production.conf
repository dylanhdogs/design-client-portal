limit_req_zone $binary_remote_addr zone=portal_login:10m rate=10r/m;
map $uri $portal_production_safe_uri {
    ~^/api/invite/ /api/invite/[REDACTED];
    default $uri;
}
log_format portal_production_safe '$remote_addr - $remote_user [$time_local] "$request_method $portal_production_safe_uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com;
    access_log /var/log/signature-portal/production-access.log portal_production_safe;
    # Deliberately drop query strings on plaintext requests so credentials are never forwarded from HTTP.
    return 301 https://portal.example.com$uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.example.com;
    access_log /var/log/signature-portal/production-access.log portal_production_safe;

    # Replace with Certbot-managed certificate paths.
    ssl_certificate /etc/letsencrypt/live/portal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PortalTLS:10m;
    ssl_session_tickets off;
    server_tokens off;

    client_max_body_size 11m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/auth/login {
        limit_req zone=portal_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
